    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
